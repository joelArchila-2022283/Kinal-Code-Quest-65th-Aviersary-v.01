<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Misiones Disponibles - KinalCodeQuest</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"> </head>
<body>
<div class="container" style="max-width: 800px;">
    <h1 class="error-code" style="font-size: 3rem;">MISIONES DISPONIBLES</h1>

    <div th:each="mision : ${misiones}" style="border: 1px solid #00ff41; margin: 15px; padding: 15px; text-align: left;">
        <h3 th:text="${mision.titulo}" style="color: #00ff41;"></h3>
        <p th:text="${mision.descripcionNarrativa}" style="color: #fff;"></p>
        <p>Recompensa: <span th:text="${mision.expRecompensa}" style="color: #ff003c;"></span> EXP</p>

        <a th:href="@{/game/mision/{id}(id=${mision.idMision})}" class="btn">INICIAR MISIÓN</a>
    </div>

    <br>
    <a th:href="@{/game/dashboard}" style="color: #00ff41;">Volver al Dashboard</a>
</div>
</body>
</html>
