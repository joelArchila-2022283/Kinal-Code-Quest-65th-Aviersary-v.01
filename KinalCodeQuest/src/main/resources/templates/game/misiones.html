<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalCodeQuest - Misiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .list-group-custom .list-group-item { background-color: #1e293b; border: 1px solid #334155; color: white; margin-bottom: 8px; border-radius: 6px; }
        .list-group-custom .list-group-item:hover { border-color: #3b82f6; }
    </style>
</head>
<body class="py-5">
<div class="container" style="max-width: 700px;">
    <div class="mb-4">
        <a th:href="@{/game/dashboard}" class="text-decoration-none small text-secondary">← Volver al Dashboard</a>
        <h2 class="fw-bold text-white mt-2" th:text="'Misiones de ' + ${area.nombre}">Misiones del Área</h2>
    </div>
    <div class="list-group list-group-custom">
        <div th:each="mision : ${misiones}" class="list-group-item p-3 d-flex justify-content-between align-items-center">
            <div>
                <h5 class="fw-bold mb-1 text-info" th:text="${mision.titulo}">Título</h5>
                <small class="text-secondary font-monospace" th:text="${mision.expRecompensa} + ' EXP'"></small>
            </div>
            <a th:href="@{/game/mision/{id}(id=${mision.idMision})}" class="btn btn-primary btn-sm fw-bold">ABRIR CONSOLA</a>
        </div>
    </div>
</div>
</body>
</html>
