<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalCodeQuest - Consola de Compilación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .ide-container { background-color: #1e293b; border: 1px solid #334155; border-radius: 6px; }
        .ide-textarea { font-family: 'Courier New', Courier, monospace; background-color: #090d16; color: #38bdf8; border: 1px solid #1e293b; resize: none; font-size: 15px; }
        .ide-textarea:focus { background-color: #090d16; color: #38bdf8; border-color: #2563eb; box-shadow: none; }
        .terminal-output { font-family: monospace; font-size: 14px; border-radius: 4px; padding: 12px; }
    </style>
</head>
<body class="py-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a th:href="@{/game/dashboard}" class="text-decoration-none small text-secondary">← Volver al Dashboard</a>
            <h3 class="fw-bold text-white mt-1" th:text="${mision.titulo}">Título</h3>
        </div>
        <span class="badge bg-primary px-3 py-2 fs-6 font-monospace" th:text="${mision.expRecompensa} + ' EXP'">0 EXP</span>
    </div>
    <div class="row g-4">
        <div class="col-md-5">
            <div class="p-4 rounded h-100 shadow-sm" style="background-color: #1e293b;">
                <h5 class="fw-bold text-secondary text-uppercase small tracking-wider mb-3">Especificación del Sistema</h5>
                <p class="text-light" style="line-height: 1.6;" th:text="${mision.descripcionNarrativa}">Descripción del problema técnico.</p>
            </div>
        </div>
        <div class="col-md-7">
            <div class="ide-container p-3 shadow">
                <form th:action="@{/game/mision/{id}/compilar(id=${mision.idMision})}" method="post">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="text-secondary small font-monospace">src/main/java/Solution.java</span>
                        <span class="text-secondary small">Intentos: <strong class="text-warning" th:text="${progreso.intentos}">0</strong></span>
                    </div>
                    <textarea name="codigoEnviado" rows="12" class="form-control ide-textarea p-3 mb-3"
                              th:text="${progreso.ultimoCodigoEnviado}" placeholder="// Escribe tu código aquí..."></textarea>
                    <button type="submit" class="btn btn-primary w-100 fw-bold font-monospace py-2 mb-3">EJECUTAR KINAL COMPILER</button>
                </form>
                <div th:if="${compilacionError}" class="terminal-output text-danger" style="background-color: #180808; border: 1px solid #7f1d1d;">
                    <span th:text="${compilacionError}"></span>
                </div>
                <div th:if="${compilacionSuccess}" class="terminal-output text-success" style="background-color: #081808; border: 1px solid #065f46;">
                    <span th:text="${compilacionSuccess}"></span>
                    <div class="mt-2">
                        <a th:href="@{/game/dashboard}" class="btn btn-sm btn-success fw-bold">Siguiente Misión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
