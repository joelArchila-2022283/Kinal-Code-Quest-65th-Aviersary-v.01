<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalCodeQuest - Consola de Compilación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body py-4">

<div class="container" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a th:href="@{/game/dashboard}" class="text-decoration-none small text-muted tech-font">
                <i class="bi bi-chevron-left"></i> VOLVER_AL_CENTRO_DE_CONTROL
            </a>
            <h3 class="fw-bold text-white mt-1 tech-font" th:text="${mision.titulo}">TÍTULO_MISIÓN</h3>
        </div>
        <span class="badge border border-info text-info px-3 py-2 fs-6 tech-font neon-glow"
              th:text="${mision.expRecompensa} + ' EXP'">0 EXP</span>
    </div>

    <div class="terminal-chassis p-4 shadow">
        <form th:action="@{/game/mision/{id}/compilar(id=${mision.idMision})}" method="post">
            <div class="d-flex justify-content-between align-items-center mb-2 px-1">
                <span class="text-secondary small tech-font">src/main/java/Solution.java</span>
                <span class="text-secondary small tech-font">INTENTOS:
                    <strong class="text-warning" th:text="${progreso.intentos}">0</strong>
                </span>
            </div>

            <textarea name="codigoEnviado" rows="12" class="form-control ide-textarea p-3 mb-3"
                      th:text="${progreso.ultimoCodigoEnviado}"
                      placeholder="// Escribe tu código aquí..." spellcheck="false"></textarea>

            <button type="submit" class="btn btn-cyber-primary w-100 fw-bold tech-font py-3 neon-glow">
                EJECUTAR_KINAL_COMPILER <i class="bi bi-play-fill ms-2"></i>
            </button>
        </form>

        <div th:if="${compilacionError}" class="terminal-output text-danger mt-3 border-start border-4 border-danger">
            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${compilacionError}">Error</span>
        </div>

        <div th:if="${compilacionSuccess}" class="terminal-output text-success mt-3 border-start border-4 border-success">
            <i class="bi bi-check2-circle"></i> <span th:text="${compilacionSuccess}">Éxito</span>
        </div>
    </div>
</div>
</body>
</html>
