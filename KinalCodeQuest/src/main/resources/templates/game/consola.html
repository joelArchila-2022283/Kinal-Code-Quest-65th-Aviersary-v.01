<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>KinalCodeQuest - Consola de Compilación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
</head>
<body class="auth-body py-4">

<div class="container" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <a th:href="@{/game/dashboard}" class="text-decoration-none small text-muted tech-font">
                <i class="bi bi-chevron-left"></i> VOLVER_AL_CENTRO_DE_CONTROL
            </a>
            <h3 class="fw-bold text-white mt-1 tech-font" th:text="${mision != null ? mision.titulo : 'CONSOLA DE COMPILACIÓN'}">TÍTULO_MISIÓN</h3>
        </div>
        <span class="badge border border-info text-info px-3 py-2 fs-6 tech-font neon-glow"
              th:text="|${mision != null ? mision.expRecompensa : 0} EXP|">0 EXP</span>
    </div>

    <div class="terminal-chassis p-1 shadow border border-secondary border-opacity-25 rounded-3" style="background-color: #1e293b;">

        <div class="d-flex justify-content-between align-items-center px-3 py-2 bg-dark rounded-top-3 border-bottom border-secondary border-opacity-25">
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-danger rounded-circle p-1" style="width: 10px; height: 10px;"></span>
                <span class="badge bg-warning rounded-circle p-1" style="width: 10px; height: 10px;"></span>
                <span class="badge bg-success rounded-circle p-1" style="width: 10px; height: 10px;"></span>
                <span class="text-secondary small tech-font ms-2">src/main/java/KinalCodeQuestApplication.java</span>
            </div>
            <span class="text-secondary small tech-font">INTENTOS:
                <strong id="contadorIntentos" class="text-warning" th:text="${progreso?.intentos != null ? progreso.intentos : 0}">0</strong>
            </span>
        </div>

        <form th:action="@{/game/mision/{id}/compilar(id=${mision != null ? mision.idMision : 1})}"
              method="post"
              id="compilerForm"
              onsubmit="return false;">

            <textarea id="editorCodigo" name="codigoEnviado" th:if="${progreso?.ultimoCodigoEnviado != null}" th:text="${progreso.ultimoCodigoEnviado}"></textarea>

            <textarea id="editorCodigo" name="codigoEnviado" th:unless="${progreso?.ultimoCodigoEnviado != null}">package com.J.M_CODERS.KinalCodeQuest;

import org.springframework.boot.CommandLineRunner;
import org.springframework.boot.SpringApplication;
import org.springframework.boot.autoconfigure.SpringBootApplication;

@SpringBootApplication
public class KinalCodeQuestApplication implements CommandLineRunner {

    public static void main(String[] args) {
       SpringApplication.run(KinalCodeQuestApplication.class, args);
    }

    @Override
    public void run(String... args) throws Exception {
       System.out.println("----------------------------------------");
       System.out.println(" KINAL CODE QUEST - SYSTEM ONLINE ");
       System.out.println("----------------------------------------");
    }
}</textarea>

            <div class="p-3 bg-dark bg-opacity-50 rounded-bottom-3">
                <button type="submit" id="btnEjecutar" class="btn btn-cyber-primary w-100 fw-bold tech-font py-3 neon-glow">
                    <span>EJECUTAR_KINAL_COMPILER</span> <i class="bi bi-play-fill ms-2"></i>
                </button>
            </div>
        </form>
    </div>

    <div id="boxTerminal" class="mt-4 shadow-lg border border-secondary border-opacity-25 rounded-3 overflow-hidden d-none">
        <div class="px-3 py-2 bg-dark d-flex justify-content-between align-items-center border-bottom border-secondary border-opacity-25">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-terminal text-info"></i>
                <span class="text-white small font-monospace">Output Terminal - KinalCompiler.exe</span>
            </div>
            <span id="badgeStatus" class="badge font-monospace text-uppercase">STATUS</span>
        </div>
        <div class="p-3 bg-black" style="min-height: 150px; max-height: 250px; overflow-y: auto;">
            <pre id="textoConsola" class="font-monospace mb-0" style="white-space: pre-wrap;">C:\></pre>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>

<script th:inline="javascript">
    var textareaEditor = document.getElementById('editorCodigo');

    var editor = CodeMirror.fromTextArea(textareaEditor, {
        lineNumbers: true,
        mode: "text/x-java",
        theme: "dracula",
        lineWrapping: true,
        matchBrackets: true,
        indentUnit: 4,
        tabSize: 4
    });

    editor.setSize(null, "420px");

    document.getElementById("compilerForm").addEventListener("submit", function(event) {
        event.preventDefault();
        editor.save();

        const form = event.target;
        const formData = new FormData(form);
        const btn = document.getElementById("btnEjecutar");

        btn.disabled = true;
        btn.querySelector("span").innerText = "COMPILANDO_SISTEMA...";

        const urlEndpoint = form.getAttribute("action");

        fetch(urlEndpoint, {
            method: "POST",
            body: new URLSearchParams(formData),
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-Requested-With": "XMLHttpRequest"
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error("Respuesta inválida del servidor HTTP.");
            }
            return response.json();
        })
        .then(data => {
            const boxTerminal = document.getElementById("boxTerminal");
            boxTerminal.classList.remove("d-none");

            const textoConsola = document.getElementById("textoConsola");
            textoConsola.innerText = data.consolaResult;

            const badge = document.getElementById("badgeStatus");
            badge.innerText = data.statusText;

            if (data.success) {
                textoConsola.style.color = "#39ff14";
                badge.className = "badge font-monospace text-uppercase bg-success bg-opacity-25 text-success";
            } else {
                textoConsola.style.color = "#ff3333";
                badge.className = "badge font-monospace text-uppercase bg-danger bg-opacity-25 text-danger";
            }

            document.getElementById("contadorIntentos").innerText = data.intentos;
        })
        .catch(err => {
            alert("No se pudo conectar con el compilador.");
            console.error(err);
        })
        .finally(() => {
            btn.disabled = false;
            btn.querySelector("span").innerText = "EJECUTAR_KINAL_COMPILER";
        });
    });

    document.getElementById("btnEjecutar").addEventListener("click", function() {
        document.getElementById("compilerForm").requestSubmit();
    });
</script>

<style>
    .CodeMirror {
        font-family: 'Share Tech Mono', monospace !important;
        font-size: 15px !important;
        padding: 10px 0;
    }
    .CodeMirror-gutters {
        background-color: #1e293b !important;
        border-right: 1px solid #334155 !important;
    }
</style>

</body>
</html>
