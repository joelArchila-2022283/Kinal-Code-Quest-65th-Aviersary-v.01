<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalCodeQuest - Terminal Core</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2family=Share+Tech+Mono&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-kinal sticky-top py-3">
    <div class="container">
        <a class="navbar-brand tech-font d-flex align-items-center fs-4" href="#">
            <i class="bi bi-terminal-fill text-info me-2"></i>
            <span class="fw-bold text-white">KINAL</span>
            <span class="text-info">CODE_QUEST</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <div class="d-none d-md-flex align-items-center gap-2 tech-font small text-success">
                <span class="spinner-grow spinner-grow-sm system-status" role="status"></span>
                <span>CORE_SYS: ACTIVE</span>
            </div>
            <a href="/auth/logout" class="btn btn-cyber-danger btn-sm tech-font px-3">
                <i class="bi bi-box-arrow-right me-1"></i> LOGOUT
            </a>
        </div>
    </div>
</nav>

<div class="container my-4 my-md-5">
    <div class="row g-4">

        <div class="col-12 col-lg-4">
            <div class="profile-card p-4 text-center">

                <div class="d-flex justify-content-center my-3">
                    <div class="avatar-container">
                        <div class="avatar-frame rounded-circle w-100 h-100"></div>
                        <i class="bi bi-shield-lock avatar-icon"></i>
                    </div>
                </div>

                <h2 class="fw-bold text-white tech-font mt-3 mb-1" th:text="${jugador.username}">OPERATOR</h2>
                <span class="badge badge-cyber px-3 py-2 tech-font mb-4" th:text="${jugador.nombreAvatar}">AVATAR_CLASS</span>

                <hr class="border-secondary opacity-20 my-4">

                <div class="text-start">
                    <h6 class="text-uppercase text-info tech-font fw-bold small mb-3">DATA_KERNEL STATISTICS</h6>

                    <div class="stat-row p-3 mb-3">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted small"><i class="bi bi-lightning-fill text-warning me-1"></i> Experiencia General</span>
                            <span class="text-white tech-font fw-bold" th:text="${jugador.experiencia} + ' EXP'">0 EXP</span>
                        </div>
                        <div class="progress bg-dark border border-secondary border-opacity-50" style="height: 6px;">
                            <div class="progress-bar bg-warning shadow" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>

                    <div class="stat-row d-flex justify-content-between align-items-center p-2 px-3 mb-2">
                        <span class="small text-muted"><i class="bi bi-cpu text-success me-2"></i>LABORIOSIDAD:</span>
                        <span class="tech-font fw-bold text-success fs-5" th:text="${jugador.ptosLaboriosidad}">0</span>
                    </div>

                    <div class="stat-row d-flex justify-content-between align-items-center p-2 px-3 mb-2">
                        <span class="small text-muted"><i class="bi bi-shield-check text-primary me-2"></i>RESPONSABILIDAD:</span>
                        <span class="tech-font fw-bold text-primary fs-5" th:text="${jugador.ptosResponsabilidad}">0</span>
                    </div>

                    <div class="stat-row d-flex justify-content-between align-items-center p-2 px-3 mb-2">
                        <span class="small text-muted"><i class="bi bi-heart-fill text-danger me-2"></i>SOLIDARIDAD:</span>
                        <span class="tech-font fw-bold text-danger fs-5" th:text="${jugador.ptosSolidaridad}">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-8">
            <div class="d-flex align-items-center mb-4 ps-2">
                <i class="bi bi-grid-3x3-gap-fill text-info fs-4 me-2"></i>
                <h4 class="fw-bold text-white mb-0 tech-font uppercase">MÓDULOS_DE_CONEXIÓN_DISPONIBLES</h4>
            </div>

            <div class="row g-4">
                <div class="col-12 col-md-6" th:each="area : ${areas}">
                    <div class="area-card h-100 p-4 d-flex flex-column justify-content-between">
                        <div>
                            <div class="d-flex align-items-center mb-3">
                                <div class="area-icon-box p-3 rounded-3 me-3">
                                    <i class="bi bi-database-fill-gear fs-3"></i>
                                </div>
                                <h5 class="fw-bold text-white mb-0 tech-font" th:text="${area.nombreArea}">AREA_NAME</h5>
                            </div>
                            <p class="text-muted small lh-base" th:text="${area.descripcion}">Descripción técnica de los desafíos lógicos embebidos en el entorno.</p>
                        </div>

                        <div class="mt-4 pt-3 border-top border-secondary border-opacity-10">
                            <a th:href="@{/game/area/{id}(id=${area.idArea})}" class="btn btn-cyber-primary w-100 py-2.5 tech-font small">
                                CONECTAR_ENTORNO <i class="bi bi-chevron-right ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
