<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinalCodeQuest - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .navbar-custom { background-color: #1e293b; border-bottom: 2px solid #2563eb; }
        .stat-card { background-color: #1e293b; border-left: 4px solid #3b82f6; }
        .area-card { background-color: #1e293b; transition: transform 0.2s, border-color 0.2s; border: 1px solid #334155; }
        .area-card:hover { transform: translateY(-3px); border-color: #3b82f6; }
    </style>
</head>
<body>
<nav class="navbar navbar-custom py-3 mb-5">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand mb-0 h1 fw-bold text-white tech-font">
            <i class="bi bi-terminal-fill text-info me-2"></i>KinalCodeQuest
        </span>
        <div class="d-flex align-items-center">
            <span class="text-secondary me-3 tech-font">Operador: <strong class="text-info" th:text="${session.usuarioLogueado?.username}">User</strong></span>
            <a th:href="@{/auth/logout}" class="btn btn-sm btn-cyber-danger font-monospace">LOGOUT</a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="row g-3 mb-5">
        <div class="col-md-3">
            <div class="stat-card p-3 shadow-sm rounded">
                <small class="text-secondary d-block text-uppercase fw-bold tech-font">Experiencia Total</small>
                <span class="fs-3 fw-bold text-white tech-font" th:text="|${jugador?.experiencia != null ? jugador.experiencia : 0} EXP|">0 XP</span>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card p-3 shadow-sm rounded" style="border-left-color: #10b981;">
                <small class="text-secondary d-block text-uppercase fw-bold tech-font">Responsabilidad</small>
                <span class="fs-3 fw-bold text-success tech-font" th:text="|${jugador?.ptosResponsabilidad != null ? jugador.ptosResponsabilidad : 0} pts|">0 pts</span>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card p-3 shadow-sm rounded" style="border-left-color: #f59e0b;">
                <small class="text-secondary d-block text-uppercase fw-bold tech-font">Laboriosidad</small>
                <span class="fs-3 fw-bold text-warning tech-font" th:text="|${jugador?.ptosLaboriosidad != null ? jugador.ptosLaboriosidad : 0} pts|">0 pts</span>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card p-3 shadow-sm rounded" style="border-left-color: #a855f7;">
                <small class="text-secondary d-block text-uppercase fw-bold tech-font">Solidaridad</small>
                <span class="fs-3 fw-bold tech-font" style="color: #c084fc;" th:text="|${jugador?.ptosSolidaridad != null ? jugador.ptosSolidaridad : 0} pts|">0 pts</span>
            </div>
        </div>
    </div>
    <h4 class="fw-bold mb-4 border-bottom border-secondary pb-2 text-white tech-font">Módulos de Especialización</h4>
    <div class="row g-4">
        <div class="col-md-4" th:each="area : ${areas}">
            <div class="card area-card h-100 shadow-sm p-4 d-flex flex-column justify-content-between text-white">
                <div>
                    <h5 class="fw-bold text-primary mb-2 tech-font" th:text="${area.nombre}">Área Técnica</h5>
                    <p class="text-secondary small" th:text="${area.descripcionTematica}">Descripción breve.</p>
                </div>
                <a th:href="@{/game/area/{idArea}(idArea=${area.idArea})}" class="btn btn-cyber-primary btn-sm w-100 fw-bold mt-3 tech-font">
                    INGRESAR AL MÓDULO <i class="bi bi-chevron-right ms-1"></i>
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
